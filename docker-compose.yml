services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paysera-app
    entrypoint: ["php", "-S", "0.0.0.0:80", "-t", "public"]
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - app_cache:/var/www/html/var/cache
      - app_logs:/var/www/html/var/log
    environment:
      APP_ENV: dev
      APP_SECRET: ${APP_SECRET:-change_me_in_production}
      DATABASE_URL: mysql://paysera:paysera@mysql:3306/paysera_transfer?serverVersion=8.0&charset=utf8mb4
      REDIS_URL: redis://redis:6379
      JWT_SECRET_KEY: '%kernel.project_dir%/config/jwt/private.pem'
      JWT_PUBLIC_KEY: '%kernel.project_dir%/config/jwt/public.pem'
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:-paysera_jwt_passphrase}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8080:80"
    networks:
      - paysera-net

  mysql:
    image: mysql:8.0
    container_name: paysera-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: paysera_transfer
      MYSQL_USER: paysera
      MYSQL_PASSWORD: paysera
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - paysera-net

  redis:
    image: redis:7-alpine
    container_name: paysera-redis
    ports:
      - "6380:6379"
    networks:
      - paysera-net

  adminer:
    image: adminer:4
    container_name: paysera-adminer
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - paysera-net

volumes:
  mysql_data:
  app_cache:
  app_logs:

networks:
  paysera-net:
    driver: bridge
