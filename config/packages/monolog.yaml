monolog:
    channels: ['transfer', 'audit']
    handlers:
        main:
            type: stream
            path: "%kernel.logs_dir%/%kernel.environment%.log"
            level: debug
            channels: ["!event"]
        transfer:
            type: stream
            path: "%kernel.logs_dir%/transfer.log"
            level: info
            channels: ["transfer"]
        audit:
            type: stream
            path: "%kernel.logs_dir%/audit.log"
            level: info
            channels: ["audit"]
        console:
            type: console
            process_psr_3_messages: false
            channels: ["!event", "!doctrine", "!console"]

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
            nested:
                type: stream
                path: php://stderr
                level: debug
